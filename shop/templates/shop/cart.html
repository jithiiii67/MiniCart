<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h1>Shopping Cart</h1>

{% if items %}

    {% for item in items %}
        <div>
            <h3>{{ item.product.name }}</h3>
            <p>Price: ₹{{ item.product.price }}</p>
            <p>Quantity: {{ item.quantity }}</p>
            <p>Subtotal: ₹{{ item.subtotal }}</p>
        </div>
        <hr>
    {% endfor %}

    <h2>Total: ₹{{ total }}</h2>
    <h2>Total: ₹{{ total }}</h2>

<a href="{% url 'checkout' %}" class="btn btn-success">
    Pay with Card
</a>


{% else %}

    <h2>Your cart is empty</h2>

{% endif %}

</body>
</html>
